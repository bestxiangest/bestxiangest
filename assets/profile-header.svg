<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">bestxiangest light profile banner</title>
  <desc id="desc">A light workspace banner for bestxiangest, showing system building, automation, hardware, and campus tools.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.52" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="ink" x1="142" y1="83" x2="1018" y2="259" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.48" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#94a3b8" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#paper)"/>
  <rect width="1200" height="360" rx="30" fill="url(#grid)"/>
  <path d="M74 76H1126" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M74 284H1126" stroke="#cbd5e1" stroke-width="1"/>

  <g transform="translate(88 64)" filter="url(#softShadow)">
    <rect width="1024" height="232" rx="28" fill="#ffffff" stroke="#dbeafe"/>
    <path d="M36 60H282" stroke="#bae6fd" stroke-width="12" stroke-linecap="round"/>
    <path d="M36 96H430" stroke="#ccfbf1" stroke-width="12" stroke-linecap="round"/>
    <path d="M36 132H338" stroke="#fef3c7" stroke-width="12" stroke-linecap="round"/>

    <text x="42" y="68" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="800" letter-spacing="1">BESTXIANGEST</text>
    <text x="44" y="112" fill="#0369a1" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="21" font-weight="700">AI automation / embedded hardware / campus tools</text>
    <text x="44" y="154" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">把身边的问题做成可运行、可迭代、可交付的小系统。</text>

    <g transform="translate(684 34)">
      <rect x="0" y="0" width="272" height="164" rx="24" fill="#f8fafc" stroke="#bfdbfe"/>
      <path d="M40 116H226" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round"/>
      <path d="M40 116C74 58 112 132 146 78C173 36 194 66 226 42" stroke="url(#ink)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="40" cy="116" r="8" fill="#0ea5e9"/>
      <circle cx="146" cy="78" r="8" fill="#14b8a6"/>
      <circle cx="226" cy="42" r="8" fill="#f59e0b"/>
      <rect x="40" y="134" width="54" height="10" rx="5" fill="#bae6fd"/>
      <rect x="106" y="134" width="76" height="10" rx="5" fill="#ccfbf1"/>
      <rect x="194" y="134" width="32" height="10" rx="5" fill="#fde68a"/>
    </g>
  </g>

  <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.78">
    <path d="M96 324H214C240 324 240 300 266 300H354"/>
    <path d="M848 36H930C958 36 958 62 986 62H1104"/>
  </g>
  <g fill="#ffffff" stroke="#93c5fd" stroke-width="2">
    <rect x="188" y="312" width="24" height="24" rx="7"/>
    <rect x="342" y="288" width="24" height="24" rx="7"/>
    <rect x="916" y="24" width="24" height="24" rx="7"/>
    <rect x="1092" y="50" width="24" height="24" rx="7"/>
  </g>
</svg>
