<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">sharp_caterpillar GitHub profile banner</title>
  <desc id="desc">A dark neon banner for bestxiangest, focused on AI automation, embedded systems, and full-stack prototypes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.36" stop-color="#111827"/>
      <stop offset="0.72" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="accent" x1="180" y1="48" x2="1010" y2="292" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.42" stop-color="#38bdf8"/>
      <stop offset="0.74" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#22c55e"/>
      <stop offset="0.52" stop-color="#38bdf8"/>
      <stop offset="0.78" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.22 0 0 0 0 0.74 0 0 0 0 1 0 0 0 0.65 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" stroke="#94a3b8" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <path d="M50 285 C165 216 256 338 364 266 C499 176 553 96 715 152 C826 190 879 285 1011 224 C1087 189 1128 124 1184 96" stroke="url(#line)" stroke-width="3" stroke-linecap="round" opacity="0.72"/>
  <path d="M87 88 C222 118 270 34 386 78 C511 126 521 230 666 202 C786 179 801 80 918 88 C1022 95 1066 161 1137 148" stroke="url(#line)" stroke-width="2" stroke-linecap="round" opacity="0.32"/>

  <circle cx="972" cy="104" r="96" fill="#38bdf8" opacity="0.09" filter="url(#glow)"/>
  <circle cx="210" cy="250" r="118" fill="#a855f7" opacity="0.11" filter="url(#glow)"/>
  <circle cx="1038" cy="240" r="46" fill="#22c55e" opacity="0.18"/>
  <circle cx="150" cy="86" r="7" fill="#22c55e"/>
  <circle cx="208" cy="98" r="4" fill="#38bdf8"/>
  <circle cx="1054" cy="74" r="5" fill="#f43f5e"/>
  <circle cx="1096" cy="105" r="3" fill="#a855f7"/>

  <g opacity="0.75">
    <rect x="78" y="62" width="16" height="16" rx="4" fill="#22c55e"/>
    <rect x="104" y="62" width="16" height="16" rx="4" fill="#38bdf8"/>
    <rect x="130" y="62" width="16" height="16" rx="4" fill="#f43f5e"/>
  </g>

  <g transform="translate(86 118)">
    <rect x="0" y="0" width="1028" height="142" rx="24" fill="#020617" opacity="0.56" stroke="#334155"/>
    <text x="46" y="56" fill="#e5e7eb" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="800" letter-spacing="4">SHARP_CATERPILLAR</text>
    <text x="48" y="94" fill="#67e8f9" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="18">AI Automation · Embedded Systems · Product Engineering</text>
    <text x="48" y="126" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">学生开发者 / sensors · scripts · real-world systems</text>
    <g transform="translate(792 32)">
      <rect x="0" y="0" width="168" height="78" rx="18" fill="#111827" stroke="#475569"/>
      <path d="M36 52 L55 24 L78 52 L95 26 L128 58" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="36" cy="52" r="6" fill="#22c55e"/>
      <circle cx="55" cy="24" r="6" fill="#38bdf8"/>
      <circle cx="78" cy="52" r="6" fill="#a855f7"/>
      <circle cx="95" cy="26" r="6" fill="#f43f5e"/>
      <circle cx="128" cy="58" r="6" fill="#f59e0b"/>
    </g>
  </g>

  <g font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="15" fill="#94a3b8">
    <text x="86" y="304">bestxiangest@github</text>
    <text x="948" y="304">build useful things</text>
  </g>
</svg>
