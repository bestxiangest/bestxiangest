<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="272" viewBox="0 0 1200 272" role="img" aria-label="GitHub 数据概览">
  <title>Signals — GitHub 数据概览</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1200" y2="272" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset=".6" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbfdff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d97ad" stop-opacity="0"/>
      <stop offset=".3" stop-color="#0d97ad" stop-opacity=".85"/>
      <stop offset=".7" stop-color="#4d61d0" stop-opacity=".85"/>
      <stop offset="1" stop-color="#0f8f65" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#e6eef6" stroke-width="1"/>
    </pattern>
    <clipPath id="plate-clip"><rect width="1200" height="272" rx="20"/></clipPath>
    <clipPath id="bar-clip"><rect x="44" y="204" width="1112" height="14" rx="7"/></clipPath>
  </defs>
  <style>
    .h { font: 700 13px ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, monospace; fill: #4d5b6d; letter-spacing: 2.2px; }
    .meta { font: 500 11.5px ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, monospace; fill: #8290a1; }
    .big { font: 800 34px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0d1a2b; }
    .cap { font: 600 10.5px ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, monospace; fill: #4d5b6d; letter-spacing: 1.1px; }
    .legend { font: 500 12px ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, monospace; fill: #4d5b6d; }
  </style>
  <g clip-path="url(#plate-clip)">
    <rect width="1200" height="272" fill="url(#plate)"/>
    <rect width="1200" height="272" fill="url(#grid)" opacity="1"/>
    <rect width="1200" height="2" fill="url(#edge)"/>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="270.5" rx="19.5" fill="none" stroke="#dde6f0" stroke-width="1.5"/>
    <text x="44" y="42" class="h">SIGNALS</text>
    <text x="1156" y="42" class="meta" text-anchor="end">since 2019 · updated 2026-09-02</text>
    <g transform="translate(44 64)"><rect width="266" height="86" rx="14" fill="#ffffff" stroke="#dde6f0"/><rect x="114" y="18" width="38" height="3" rx="1.5" fill="#bf7c08"/><text x="133" y="54" class="big" text-anchor="middle">164</text><text x="133" y="73" class="cap" text-anchor="middle">stars earned</text></g>
    <g transform="translate(326 64)"><rect width="266" height="86" rx="14" fill="#ffffff" stroke="#dde6f0"/><rect x="114" y="18" width="38" height="3" rx="1.5" fill="#0d97ad"/><text x="133" y="54" class="big" text-anchor="middle">22</text><text x="133" y="73" class="cap" text-anchor="middle">public repos</text></g>
    <g transform="translate(608 64)"><rect width="266" height="86" rx="14" fill="#ffffff" stroke="#dde6f0"/><rect x="114" y="18" width="38" height="3" rx="1.5" fill="#4d61d0"/><text x="133" y="54" class="big" text-anchor="middle">19</text><text x="133" y="73" class="cap" text-anchor="middle">forks</text></g>
    <g transform="translate(890 64)"><rect width="266" height="86" rx="14" fill="#ffffff" stroke="#dde6f0"/><rect x="114" y="18" width="38" height="3" rx="1.5" fill="#0f8f65"/><text x="133" y="54" class="big" text-anchor="middle">12</text><text x="133" y="73" class="cap" text-anchor="middle">followers</text></g>
    <text x="44" y="192" class="h">LANGUAGE MIX</text>
    <rect x="44" y="204" width="1112" height="14" rx="7" fill="#e6eef6"/>
    <g clip-path="url(#bar-clip)">
      <rect x="44.0" y="204" width="326.1" height="14" fill="#c9bb4b"/>
      <rect x="370.1" y="204" width="294.4" height="14" fill="#555555"/>
      <rect x="664.5" y="204" width="161.1" height="14" fill="#e34c26"/>
      <rect x="825.6" y="204" width="154.5" height="14" fill="#355570"/>
      <rect x="980.1" y="204" width="88.5" height="14" fill="#3572a5"/>
      <rect x="1068.6" y="204" width="37.1" height="14" fill="#f34b7d"/>
      <rect x="1105.7" y="204" width="50.3" height="14" fill="#8290a1"/>
    </g>
    <circle cx="48" cy="242" r="4" fill="#c9bb4b"/><text x="59" y="246.5" class="legend">JavaScript 29.3%</text>
    <circle cx="197" cy="242" r="4" fill="#555555"/><text x="208" y="246.5" class="legend">C 26.5%</text>
    <circle cx="285" cy="242" r="4" fill="#e34c26"/><text x="296" y="246.5" class="legend">HTML 14.5%</text>
    <circle cx="393" cy="242" r="4" fill="#355570"/><text x="404" y="246.5" class="legend">GDScript 13.9%</text>
    <circle cx="528" cy="242" r="4" fill="#3572a5"/><text x="539" y="246.5" class="legend">Python 8.0%</text>
    <circle cx="643" cy="242" r="4" fill="#f34b7d"/><text x="654" y="246.5" class="legend">C++ 3.3%</text>
    <circle cx="738" cy="242" r="4" fill="#8290a1"/><text x="749" y="246.5" class="legend">Other 4.5%</text>
</svg>
