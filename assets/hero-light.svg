    <path d="M946,102 H1028 L1048,122 H1096" class="wire"/>
    <path d="M946,102 H1028 L1048,122 H1096" class="pulse" stroke="#0f8f65" style="animation-delay:1.45s"/>
    <path d="M946,198 H1028 L1048,178 H1096" class="wire"/>
    <path d="M946,198 H1028 L1048,178 H1096" class="pulse" stroke="#4d61d0" style="animation-delay:1.25s"/>
    <path d="M946,198 H1010 L1048,236 H1096" class="wire"/>
    <path d="M946,198 H1010 L1048,236 H1096" class="pulse" stroke="#0f8f65" style="animation-delay:1.7s"/>
    <circle cx="804" cy="150" r="16.5" fill="#0d97ad" class="halo" style="animation-delay:0s"/>
    <circle cx="804" cy="150" r="7.5" fill="#0d97ad"/>
    <circle cx="804" cy="150" r="3.1" fill="#ffffff"/>
    <circle cx="946" cy="102" r="12.1" fill="#0d97ad" class="halo" style="animation-delay:0.4s"/>
    <circle cx="946" cy="102" r="5.5" fill="#0d97ad"/>
    <circle cx="946" cy="102" r="2.3" fill="#ffffff"/>
    <circle cx="946" cy="198" r="12.1" fill="#0d97ad" class="halo" style="animation-delay:0.8s"/>
    <circle cx="946" cy="198" r="5.5" fill="#0d97ad"/>
    <circle cx="946" cy="198" r="2.3" fill="#ffffff"/>
    <circle cx="1096" cy="64" r="9.9" fill="#4d61d0" class="halo" style="animation-delay:1.2s"/>
    <circle cx="1096" cy="64" r="4.5" fill="#4d61d0"/>
    <circle cx="1096" cy="64" r="1.9" fill="#ffffff"/>
    <circle cx="1096" cy="122" r="9.9" fill="#0f8f65" class="halo" style="animation-delay:1.6s"/>
    <circle cx="1096" cy="122" r="4.5" fill="#0f8f65"/>
    <circle cx="1096" cy="122" r="1.9" fill="#ffffff"/>
    <circle cx="1096" cy="178" r="9.9" fill="#4d61d0" class="halo" style="animation-delay:2.0s"/>
    <circle cx="1096" cy="178" r="4.5" fill="#4d61d0"/>
    <circle cx="1096" cy="178" r="1.9" fill="#ffffff"/>
    <circle cx="1096" cy="236" r="9.9" fill="#0f8f65" class="halo" style="animation-delay:2.4s"/>
    <circle cx="1096" cy="236" r="4.5" fill="#0f8f65"/>
    <circle cx="1096" cy="236" r="1.9" fill="#ffffff"/>
    </g>
    <text x="950" y="278" class="mono faint" text-anchor="middle">idea  ──▶  prototype  ──▶  shipped system</text>

    <rect y="297" width="1200" height="3" fill="url(#scan)"/>
  </g>
</svg>
