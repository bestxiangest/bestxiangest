<svg width="960" height="360" viewBox="0 0 960 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">bestxiangest featured projects</title>
  <desc id="desc">Four featured projects: Intelligent Guide Cane, DeltaForce Auto Purchase, Goods Trading Center, and clawd-buddy.</desc>
  <style>
    .title { font: 800 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
    .body { font: 600 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
    .tag { font: 700 12px SFMono-Regular, Consolas, "Liberation Mono", monospace; fill: #334155; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="958" height="358" rx="28" fill="url(#bg)" stroke="#dbeafe"/>

  <g transform="translate(34 34)">
    <rect width="426" height="132" rx="22" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="24" y="38" class="title">Intelligent Guide Cane</text>
    <text x="24" y="68" class="body">ESP32-S3 multimodal assistive cane with sensors,</text>
    <text x="24" y="92" class="body">AI perception, voice interaction, and navigation.</text>
    <text x="24" y="118" class="tag">C · ESP32-S3 · AI perception</text>
    <circle cx="382" cy="42" r="20" fill="#14b8a6"/>
    <path d="M372 42H392M382 32V52" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g transform="translate(500 34)">
    <rect width="426" height="132" rx="22" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="24" y="38" class="title">DeltaForce Auto Purchase</text>
    <text x="24" y="68" class="body">Computer-vision automation that reads screen state</text>
    <text x="24" y="92" class="body">and turns fast repeated actions into a workflow.</text>
    <text x="24" y="118" class="tag">Python · OpenCV · automation</text>
    <circle cx="382" cy="42" r="20" fill="#0ea5e9"/>
    <path d="M371 43L380 52L394 31" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(34 194)">
    <rect width="426" height="132" rx="22" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="24" y="38" class="title">Goods Trading Center</text>
    <text x="24" y="68" class="body">Campus second-hand trading backend covering users,</text>
    <text x="24" y="92" class="body">items, transactions, reviews, and messages.</text>
    <text x="24" y="118" class="tag">Flask · REST API · campus product</text>
    <circle cx="382" cy="42" r="20" fill="#a855f7"/>
    <rect x="370" y="31" width="24" height="22" rx="5" fill="#fff"/>
  </g>

  <g transform="translate(500 194)">
    <rect width="426" height="132" rx="22" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="24" y="38" class="title">clawd-buddy</text>
    <text x="24" y="68" class="body">Electron desktop companion with local behavior loops,</text>
    <text x="24" y="92" class="body">mouse interaction, and animation state management.</text>
    <text x="24" y="118" class="tag">Electron · JavaScript · desktop UX</text>
    <circle cx="382" cy="42" r="20" fill="#f59e0b"/>
    <path d="M371 52L382 30L393 52H371Z" fill="#fff"/>
  </g>
</svg>
