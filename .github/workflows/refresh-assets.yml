name: Refresh profile assets

on:
  workflow_dispatch:
  schedule:
    - cron: "45 16 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5

      - name: Rebuild SVG assets from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: bestxiangest
        run: python3 scripts/build_assets.py

      - name: Commit refreshed assets
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets
          if git diff --cached --quiet; then
            echo "No asset changes."
          else
            git commit -m "Refresh profile assets"
            git push
          fi
